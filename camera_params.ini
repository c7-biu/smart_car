# 摄像头参数配置文件
# 修改后重启程序即可生效
#
# 说明：
# 1. 下面的范围是根据当前摄像头实际查询结果整理的
# 2. 超出范围通常会被摄像头忽略，或者设置失败

# 亮度：画面整体明暗
# 范围：-64 ~ 64
brightness=0

# 对比度：明暗差异强弱
# 范围：0 ~ 64
contrast=0

# 饱和度：颜色浓艳程度
# 范围：0 ~ 128
saturation=128

# 色调：颜色偏移
# 范围：-40 ~ 40
hue=0

# 锐度：边缘清晰程度
# 范围：0 ~ 6
sharpness=2

# Gamma：中间灰度曲线
# 范围：72 ~ 500
gamma=72

# 增益：整体信号放大
# 范围：0 ~ 100
gain=0

# 自动白平衡：true/false
# true: 摄像头自动调白平衡
# false: 使用下面的白平衡温度
auto_white_balance=true

# 白平衡色温
# 范围：2800 ~ 6500
white_balance_temperature=5000

# 手动曝光：true/false
# true: 使用固定曝光值
# false: 摄像头自动曝光
manual_exposure=true

# 曝光值
# 范围：1 ~ 5000
exposure_absolute=50

# 帧率设置
# 分子 / 分母 = 秒/帧
# 例如 1/30 = 30fps
frame_rate_numerator=1
frame_rate_denominator=120

